# Alembic configuration. The database URL is NOT stored here: env.py builds it
# from environment variables (DB_* settings) using the schema-owning role.
[alembic]
script_location = %(here)s/app/database/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC
truncate_slug_length = 40
path_separator = os
